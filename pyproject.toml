[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-transcript-extractor"
version = "0.1.0"
description = "Extract, clean, and format YouTube transcripts locally."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.103,<0.116",
    "httpx>=0.24,<0.29",
    "openai>=1.50,<2",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.27,<0.35",
    "youtube-transcript-api>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
]

[project.scripts]
ytx = "youtube_transcript_extractor.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_transcript_extractor = ["static/*"]

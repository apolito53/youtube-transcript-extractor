app = "youtube-transcript-extractor-gtphbw"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  YTX_HOST = "0.0.0.0"
  YTX_PORT = "8080"
  YTX_CACHE_PATH = "/data/transcripts.sqlite3"
  YTX_PHASE0_STATE_PATH = "/data/phase0.sqlite3"

[mounts]
  source = "ytx_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

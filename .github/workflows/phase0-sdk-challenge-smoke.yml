name: Phase 0 SDK challenge smoke

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Exercise exact SDK challenge path
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/smoke.txt 2>&1
          import asyncio
          import base64
          import json
          import traceback
          from types import SimpleNamespace

          from youtube_transcript_extractor.phase0_x402 import _build_real_server, _encode_header

          settings = SimpleNamespace(
              phase0_x402_facilitator_url='https://x402.org/facilitator',
              phase0_x402_network='eip155:84532',
              phase0_x402_price='$0.001',
              phase0_x402_pay_to_address='0x9632c7eD958612C79DdBEF7EA9798D0950b207f9',
          )

          async def main():
              server, requirements = _build_real_server(settings)
              print('initialized_and_built=true')
              print('requirements=', json.dumps(requirements.model_dump(by_alias=True), sort_keys=True))
              required = server.create_payment_required_response(
                  [requirements],
                  resource={
                      'url': 'https://youtube-transcript-extractor-gtphbw.fly.dev/internal/phase0/x402',
                      'description': 'Synthetic YouTube Transcript Extractor Phase 0 lifecycle probe',
                      'mime_type': 'application/json',
                  },
              )
              if hasattr(required, '__await__'):
                  required = await required
              print('payment_required=', json.dumps(required.model_dump(by_alias=True), sort_keys=True))
              encoded = _encode_header(required)
              print('encoded_bytes=', len(encoded.encode()))
              decoded = json.loads(base64.b64decode(encoded).decode())
              print('roundtrip=', json.dumps(decoded, sort_keys=True))

          try:
              asyncio.run(main())
          except Exception:
              traceback.print_exc()
              raise
          PY
          rc=$?
          mkdir -p .ops
          python - "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          rc = int(sys.argv[1])
          text = Path('/tmp/smoke.txt').read_text(errors='replace')
          Path('.ops/phase0-sdk-challenge-smoke.json').write_text(json.dumps({
              'success': rc == 0,
              'exit_code': rc,
              'output': text[-12000:],
          }, indent=2)+'\n')
          PY
          cat .ops/phase0-sdk-challenge-smoke.json
          exit "$rc"
      - name: Persist smoke evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nova-ops[bot]'
          git config user.email 'nova-ops[bot]@users.noreply.github.com'
          git add .ops/phase0-sdk-challenge-smoke.json
          git commit -m 'Record Phase 0 SDK challenge smoke' || exit 0
          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push origin HEAD:master; then exit 0; fi
            sleep 2
          done
          exit 1

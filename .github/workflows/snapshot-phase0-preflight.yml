name: Snapshot Phase 0 preflight

on:
  push:
    branches: [master]
    paths:
      - .ops/snapshot-phase0-preflight.trigger

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: a25162d5e4fa79e4eb3e40d9d6319af2946e7138
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Snapshot exact preflight run
        shell: bash
        run: |
          set -euo pipefail
          runs="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=100")"
          run="$(jq -c '[.workflow_runs[] | select(.name == "Phase 0 Fly preflight")] | sort_by(.created_at) | last // empty' <<<"$runs")"
          test -n "$run"
          mkdir -p .ops
          jq -n --argjson run "$run" '{run_id:$run.id,status:$run.status,conclusion:$run.conclusion,created_at:$run.created_at,updated_at:$run.updated_at,head_sha:$run.head_sha}' > .ops/phase0-preflight-status.json
      - name: Persist status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nova-ops[bot]'
          git config user.email 'nova-ops[bot]@users.noreply.github.com'
          git add .ops/phase0-preflight-status.json
          git commit -m 'Snapshot Phase 0 preflight status' || exit 0
          git pull --rebase origin master
          git push origin HEAD:master

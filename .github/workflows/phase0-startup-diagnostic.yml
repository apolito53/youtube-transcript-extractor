name: Phase 0 Fly startup diagnostic

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: youtube-transcript-extractor-gtphbw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Capture Fly status and recent logs
        shell: bash
        run: |
          set -u
          mkdir -p .ops
          {
            echo '=== fly status ==='
            flyctl status --app "$APP_NAME" 2>&1 || true
            echo
            echo '=== fly machine list ==='
            flyctl machine list --app "$APP_NAME" 2>&1 || true
            echo
            echo '=== recent fly logs ==='
            timeout 20s flyctl logs --app "$APP_NAME" 2>&1 || true
          } > /tmp/raw-diagnostic.txt
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/raw-diagnostic.txt').read_text(errors='replace')
          # Defensive sanitization: redact common assignment/header forms and raw 32-byte hex secrets.
          text = re.sub(r'(?i)(authorization|api[_-]?key|private[_-]?key|secret|token)(\s*[:=]\s*)\S+', r'\1\2[redacted]', text)
          text = re.sub(r'(?<![0-9A-Fa-f])0x[0-9A-Fa-f]{64}(?![0-9A-Fa-f])', '[redacted-hex32]', text)
          Path('.ops/phase0-fly-startup-diagnostic.txt').write_text(text)
          PY
          cat .ops/phase0-fly-startup-diagnostic.txt
      - name: Persist sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nova-ops[bot]'
          git config user.email 'nova-ops[bot]@users.noreply.github.com'
          git add .ops/phase0-fly-startup-diagnostic.txt
          git commit -m 'Record Phase 0 Fly startup diagnostic' || exit 0
          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push origin HEAD:master; then exit 0; fi
            sleep 2
          done
          exit 1

name: Read Phase 0 Fly address

on:
  push:
    branches: [master]
    paths:
      - .ops/read-phase0-fly-address.trigger

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: youtube-transcript-extractor-gtphbw
      KNOWN_TEST_BUYER: 0x60d46F6b4c420b6405EEeB09dB07D92E0BD0DcEa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read public address only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}"
          raw="$(flyctl ssh console --app "$APP_NAME" -C 'printenv PAY_TO_ADDRESS' 2>/tmp/fly-ssh.err || true)"
          address="$(printf '%s' "$raw" | grep -Eo '0x[0-9A-Fa-f]{40}' | head -n1 || true)"
          test -n "$address"
          matches=false
          if [ "${address,,}" = "${KNOWN_TEST_BUYER,,}" ]; then matches=true; fi
          mkdir -p .ops
          jq -n --arg address "$address" --argjson matches_known_test_buyer "$matches" '{pay_to_address:$address,matches_known_test_buyer:$matches_known_test_buyer}' > .ops/phase0-fly-address.json
          cat .ops/phase0-fly-address.json
      - name: Persist sanitized address result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nova-ops[bot]'
          git config user.email 'nova-ops[bot]@users.noreply.github.com'
          git add .ops/phase0-fly-address.json
          git commit -m 'Record sanitized Phase 0 Fly address' || exit 0
          git pull --rebase origin master
          git push origin HEAD:master

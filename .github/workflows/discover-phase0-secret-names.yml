name: Discover Phase 0 secret names

on:
  push:
    branches: [master]
    paths:
      - .ops/discover-phase0-secret-names.trigger

permissions:
  actions: read
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      YTE_PROVIDER_WALLET_SECRET: ${{ secrets.YTE_PROVIDER_WALLET_SECRET }}
      YTX_PROVIDER_WALLET_SECRET: ${{ secrets.YTX_PROVIDER_WALLET_SECRET }}
      YTX_WALLET_SECRET: ${{ secrets.YTX_WALLET_SECRET }}
      YTX_PROVIDER_SECRET: ${{ secrets.YTX_PROVIDER_SECRET }}
      YOUTUBE_TRANSCRIPT_PROVIDER_WALLET_SECRET: ${{ secrets.YOUTUBE_TRANSCRIPT_PROVIDER_WALLET_SECRET }}
      YOUTUBE_TRANSCRIPT_WALLET_SECRET: ${{ secrets.YOUTUBE_TRANSCRIPT_WALLET_SECRET }}
      YOUTUBE_TRANSCRIPT_EXTRACTOR_PROVIDER_WALLET_SECRET: ${{ secrets.YOUTUBE_TRANSCRIPT_EXTRACTOR_PROVIDER_WALLET_SECRET }}
      YOUTUBE_TRANSCRIPT_EXTRACTOR_WALLET_SECRET: ${{ secrets.YOUTUBE_TRANSCRIPT_EXTRACTOR_WALLET_SECRET }}
      YOUTUBE_TRANSCRIPT_EXTRACTOR_PROVIDER_SECRET: ${{ secrets.YOUTUBE_TRANSCRIPT_EXTRACTOR_PROVIDER_SECRET }}
      PROVIDER_WALLET_SECRET: ${{ secrets.PROVIDER_WALLET_SECRET }}
      APP_NAME: youtube-transcript-extractor-gtphbw
      KNOWN_TEST_BUYER: 0x60d46F6b4c420b6405EEeB09dB07D92E0BD0DcEa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'eth-account>=0.13,<0.14'
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Collect sanitized metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ops

          github_access=false
          if gh api "/repos/${GITHUB_REPOSITORY}/actions/secrets" >/tmp/github-secrets.json 2>/tmp/github-secrets.err; then
            github_access=true
            jq '[.secrets[].name] | sort' /tmp/github-secrets.json > /tmp/github-secret-names.json
          else
            printf '[]\n' > /tmp/github-secret-names.json
          fi

          source_name=''
          raw=''
          for candidate in \
            YTE_PROVIDER_WALLET_SECRET \
            YTX_PROVIDER_WALLET_SECRET YTX_WALLET_SECRET YTX_PROVIDER_SECRET \
            YOUTUBE_TRANSCRIPT_PROVIDER_WALLET_SECRET YOUTUBE_TRANSCRIPT_WALLET_SECRET \
            YOUTUBE_TRANSCRIPT_EXTRACTOR_PROVIDER_WALLET_SECRET \
            YOUTUBE_TRANSCRIPT_EXTRACTOR_WALLET_SECRET \
            YOUTUBE_TRANSCRIPT_EXTRACTOR_PROVIDER_SECRET PROVIDER_WALLET_SECRET; do
            value="${!candidate:-}"
            if [ -n "$value" ]; then source_name="$candidate"; raw="$value"; break; fi
          done

          provider_address=''
          if [ -n "$raw" ]; then
            provider_address="$(RAW_PROVIDER_WALLET_SECRET="$raw" python - <<'PY'
          import os
          from eth_account import Account
          print(Account.from_key(os.environ['RAW_PROVIDER_WALLET_SECRET']).address)
          PY
          )"
          fi
          unset raw

          test -n "${FLY_API_TOKEN:-}"
          if flyctl secrets list --app "$APP_NAME" --json >/tmp/fly-secrets.json 2>/tmp/fly-secrets.err; then
            jq '[.[] | (.Name // .name)] | map(select(. != null)) | sort' /tmp/fly-secrets.json > /tmp/fly-secret-names.json
          else
            flyctl secrets list --app "$APP_NAME" >/tmp/fly-secrets.txt
            awk 'NR > 1 && NF > 0 {print $1}' /tmp/fly-secrets.txt | sort -u | jq -R -s 'split("\n") | map(select(length > 0))' > /tmp/fly-secret-names.json
          fi

          fly_pay_to=''
          if command -v timeout >/dev/null 2>&1; then
            ssh_output="$(timeout 45s flyctl ssh console --app "$APP_NAME" -C 'printenv PAY_TO_ADDRESS' 2>/tmp/fly-ssh.err || true)"
            fly_pay_to="$(printf '%s' "$ssh_output" | grep -Eo '0x[0-9A-Fa-f]{40}' | head -n1 || true)"
          fi

          provider_present=false; [ -n "$provider_address" ] && provider_present=true
          fly_pay_to_present=false; [ -n "$fly_pay_to" ] && fly_pay_to_present=true
          matches_test_buyer=false
          if [ -n "$fly_pay_to" ] && [ "${fly_pay_to,,}" = "${KNOWN_TEST_BUYER,,}" ]; then matches_test_buyer=true; fi

          jq -n \
            --argjson github_secret_names_accessible "$github_access" \
            --slurpfile github_secret_names /tmp/github-secret-names.json \
            --slurpfile fly_secret_names /tmp/fly-secret-names.json \
            --argjson provider_secret_present "$provider_present" \
            --arg provider_secret_source "$source_name" \
            --arg provider_address "$provider_address" \
            --argjson fly_pay_to_present "$fly_pay_to_present" \
            --arg fly_pay_to_address "$fly_pay_to" \
            --argjson fly_pay_to_matches_known_test_buyer "$matches_test_buyer" \
            '{github_secret_names_accessible:$github_secret_names_accessible,github_secret_names:$github_secret_names[0],fly_secret_names:$fly_secret_names[0],provider_secret_present:$provider_secret_present,provider_secret_source:$provider_secret_source,provider_address:$provider_address,fly_pay_to_present:$fly_pay_to_present,fly_pay_to_address:$fly_pay_to_address,fly_pay_to_matches_known_test_buyer:$fly_pay_to_matches_known_test_buyer}' \
            > .ops/phase0-secret-names.json
          cat .ops/phase0-secret-names.json
      - name: Persist sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nova-ops[bot]'
          git config user.email 'nova-ops[bot]@users.noreply.github.com'
          git add .ops/phase0-secret-names.json
          git commit -m 'Record Phase 0 secret names' || exit 0
          for attempt in 1 2 3; do
            if git pull --rebase origin master && git push origin HEAD:master; then exit 0; fi
            sleep 2
          done
          exit 1
